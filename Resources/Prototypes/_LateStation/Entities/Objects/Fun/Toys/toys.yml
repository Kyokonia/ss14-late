#BASE FILES FOR ALL LS PLUSHIES

- type: entity
  parent: BasePlushie
  id: BaseMothPlushie  # To reduce clutter
  abstract: true
  components:
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: Edible
    requiresSpecialDigestion: true
    useSound:
      path: /Audio/Voice/Moth/moth_chitter.ogg

- type: entity
  parent: BasePlushie
  id: BaseWehPlushie  # To reduce clutter
  abstract: true
  components:
  - type: EmitSoundOnUse
    sound:
     path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnLand
    sound:
     path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnActivate
    sound:
     path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnTrigger
    sound:
     path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnCollide
    sound:
     path: /Audio/Items/Toys/weh.ogg
  - type: Edible
    requiresSpecialDigestion: true
    useSound:
     path: /Audio/Items/Toys/weh.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
     path: /Audio/Items/Toys/weh.ogg
  - type: Speech
    speechVerb: Reptilian # for pais (In the secret stash)

-  type: entity
   parent: BasePlushie
   id: BaseHumanPlushie  # To reduce clutter
   abstract: true
   components:
   - type: EmitSoundOnUse
     sound:
      path: /Audio/Items/Toys/ian.ogg
   - type: EmitSoundOnLand
     sound:
       collection: ToySqueak
   - type: EmitSoundOnActivate
     sound:
       collection: ToySqueak
   - type: EmitSoundOnTrigger
     sound:
       collection: ToySqueak
   - type: EmitSoundOnCollide
     sound:
       collection: ToySqueak
   - type: Edible
     requiresSpecialDigestion: true
     useSound:
       collection: ToySqueak
   - type: MeleeWeapon
     wideAnimationRotation: 180
     soundHit:
       path: /Audio/Items/Toys/ian.ogg
   - type: Speech
     speechVerb: Default

